<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Drug Emergency Response Prediction{% endblock %}</title>
  <meta name="description" content="AI-powered Drug Emergency Response Prediction System — ML Project" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- ── NIGHT SKY CANVAS (stars) ── -->
  <canvas id="starCanvas"></canvas>

  <!-- ── AURORA BANDS ── -->
  <div class="aurora-wrap">
    <div class="aurora-band aurora-band-1"></div>
    <div class="aurora-band aurora-band-2"></div>
    <div class="aurora-band aurora-band-3"></div>
  </div>

  <!-- ── SPACE GRID OVERLAY ── -->
  <div class="space-grid"></div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">💊</div>
      <div class="brand-text">
        <span class="brand-name">DrugPredict AI</span>
        <span class="brand-sub">Emergency Response System</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}" id="nav-home">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="/predict" class="nav-item {% if request.path == '/predict' %}active{% endif %}" id="nav-predict">
        <i data-lucide="brain-circuit"></i>
        <span>Predict</span>
      </a>
      <a href="/analytics" class="nav-item {% if request.path == '/analytics' %}active{% endif %}" id="nav-analytics">
        <i data-lucide="bar-chart-3"></i>
        <span>Analytics</span>
      </a>
      <a href="/recommend" class="nav-item {% if request.path == '/recommend' %}active{% endif %}" id="nav-recommend">
        <i data-lucide="stethoscope"></i>
        <span>Recommend</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="model-badge">
        <i data-lucide="cpu"></i>
        <span>ML Models Active</span>
        <div class="status-dot"></div>
      </div>
    </div>
  </aside>

  <!-- Mobile top bar -->
  <header class="topbar" id="topbar">
    <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">
      <i data-lucide="menu"></i>
    </button>
    <span class="topbar-title">{% block page_title %}DrugPredict AI{% endblock %}</span>
    <div class="topbar-right">
      <div class="pulse-dot"></div>
      <span class="live-label">LIVE</span>
    </div>
  </header>

  <!-- Main content -->
  <main class="main-content" id="mainContent">
    {% block content %}{% endblock %}
  </main>

  <!-- ── STARFIELD SCRIPT ── -->
  <script>
    (function() {
      const canvas = document.getElementById('starCanvas');
      const ctx    = canvas.getContext('2d');

      let W, H, stars = [], shootingStars = [];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function makeStar() {
        return {
          x:    Math.random() * W,
          y:    Math.random() * H,
          r:    Math.random() * 1.3 + 0.1,
          base: Math.random() * 0.7 + 0.1,
          speed: Math.random() * 0.008 + 0.002,
          phase: Math.random() * Math.PI * 2,
          // slight blue-white tint
          hue:  Math.random() > 0.85 ? 200 + Math.random() * 40 : 0,
        };
      }

      function initStars(count) {
        stars = [];
        for (let i = 0; i < count; i++) stars.push(makeStar());
      }

      function launchShootingStar() {
        const x = Math.random() * W * 0.8;
        const y = Math.random() * H * 0.3;
        shootingStars.push({
          x, y,
          vx: 3 + Math.random() * 4,
          vy: 1.5 + Math.random() * 2.5,
          len: 80 + Math.random() * 120,
          alpha: 1,
          decay: 0.012 + Math.random() * 0.01,
        });
      }

      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Stars
        stars.forEach(s => {
          const a = s.base + Math.sin(frame * s.speed + s.phase) * 0.3;
          const col = s.hue === 0
            ? `rgba(255,255,255,${a})`
            : `hsla(${s.hue},60%,90%,${a})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = col;
          ctx.fill();
        });

        // Shooting stars
        shootingStars = shootingStars.filter(ss => ss.alpha > 0);
        shootingStars.forEach(ss => {
          const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.len, ss.y - ss.len * 0.5);
          grad.addColorStop(0, `rgba(180,230,255,${ss.alpha})`);
          grad.addColorStop(1, 'rgba(180,230,255,0)');
          ctx.beginPath();
          ctx.moveTo(ss.x, ss.y);
          ctx.lineTo(ss.x - ss.len, ss.y - ss.len * 0.5);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ss.x += ss.vx;
          ss.y += ss.vy;
          ss.alpha -= ss.decay;
        });

        frame++;
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', () => { resize(); initStars(220); });
      resize();
      initStars(220);
      draw();

      // Shooting star every 4–9s
      function scheduleStar() {
        launchShootingStar();
        setTimeout(scheduleStar, 4000 + Math.random() * 5000);
      }
      setTimeout(scheduleStar, 2000);
    })();

    // Sidebar toggle
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      const sidebar = document.getElementById('sidebar');
      const btn = document.getElementById('menuBtn');
      if (window.innerWidth < 900 && !sidebar.contains(e.target) && btn && !btn.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });

    // Init Lucide icons
    lucide.createIcons();
  </script>

  <!-- Aurora Hover Effects Engine -->
  <script src="/static/js/effects.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
